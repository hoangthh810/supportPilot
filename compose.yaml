name: supportpilot

x-postgres-image: &postgres-image ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supportpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [supportpilot-private]
    volumes:
      - supportpilot-postgres-data:/var/lib/postgresql/data

  db-bootstrap:
    image: *postgres-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_BOOTSTRAP_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supportpilot}
      SUPPORT_OWNER_PASSWORD: ${SUPPORT_OWNER_PASSWORD:?SUPPORT_OWNER_PASSWORD is required}
      COMMERCE_OWNER_PASSWORD: ${COMMERCE_OWNER_PASSWORD:?COMMERCE_OWNER_PASSWORD is required}
      SUPPORT_APP_PASSWORD: ${SUPPORT_APP_PASSWORD:?SUPPORT_APP_PASSWORD is required}
      COMMERCE_APP_PASSWORD: ${COMMERCE_APP_PASSWORD:?COMMERCE_APP_PASSWORD is required}
    entrypoint: ["/bin/sh", "/db/run-phase1-bootstrap.sh"]
    networks: [supportpilot-private]
    restart: "no"
    volumes:
      - ./infrastructure/db/bootstrap/bootstrap.sql:/db/bootstrap.sql:ro
      - ./infrastructure/db/bootstrap/run-bootstrap.sh:/db/run-bootstrap.sh:ro
      - ./infrastructure/db/bootstrap/phase1-extensions.sql:/db/phase1-extensions.sql:ro
      - ./infrastructure/db/bootstrap/run-phase1-bootstrap.sh:/db/run-phase1-bootstrap.sh:ro

  migrate-support:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      SUPPORT_MIGRATION_DATABASE_URL: postgresql+asyncpg://support_owner:${SUPPORT_OWNER_PASSWORD:?SUPPORT_OWNER_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supportpilot}
    command: ["alembic", "-c", "infrastructure/migrations/support/alembic.ini", "upgrade", "head"]
    networks: [supportpilot-private]
    restart: "no"

  migrate-commerce:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    environment:
      COMMERCE_MIGRATION_DATABASE_URL: postgresql+asyncpg://commerce_owner:${COMMERCE_OWNER_PASSWORD:?COMMERCE_OWNER_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supportpilot}
    command: ["alembic", "-c", "infrastructure/migrations/commerce/alembic.ini", "upgrade", "head"]
    networks: [supportpilot-private]
    restart: "no"

  mock-commerce:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    depends_on:
      migrate-commerce:
        condition: service_completed_successfully
    environment:
      COMMERCE_DATABASE_URL: postgresql+asyncpg://commerce_app:${COMMERCE_APP_PASSWORD:?COMMERCE_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supportpilot}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
    command: ["python", "infrastructure/containers/mock_commerce_health.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [supportpilot-private]

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    depends_on:
      migrate-support:
        condition: service_completed_successfully
      mock-commerce:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_NAME: SupportPilot
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FRONTEND_ORIGIN: http://localhost:5173
      CORRELATION_HEADER: X-Correlation-ID
      WORKFLOW_REQUEST_TIMEOUT_SECONDS: 60
      WORKFLOW_FINALIZATION_RESERVE_SECONDS: 5
      WORKFLOW_PROFILE: walking_skeleton
      SUPPORT_DATABASE_URL: postgresql+asyncpg://support_app:${SUPPORT_APP_PASSWORD:?SUPPORT_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-supportpilot}
      DB_POOL_SIZE: 10
      DB_POOL_TIMEOUT_SECONDS: 5
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      JWT_ISSUER: supportpilot
      ACCESS_TOKEN_TTL_MINUTES: 15
      PASSWORD_HASH_SCHEME: argon2
      AUTH_RATE_LIMIT_PER_MINUTE: 10
      LLM_PROVIDER: fake
      GEMINI_MODEL: gemini-3.6-flash
      LLM_TIMEOUT_SECONDS: 12
      LLM_STRUCTURED_OUTPUT_MAX_ATTEMPTS: 2
      LLM_MAX_TOKENS_PER_RUN: 12000
      EMBEDDING_PROVIDER: fake
      EMBEDDING_MODEL: intfloat/multilingual-e5-small
      EMBEDDING_REVISION: c007d7ef6fd86656326059b28395a7a03a7c5846
      EMBEDDING_DIMENSION: 384
      EMBEDDING_INPUT_FORMAT_VERSION: e5-prefix-v1
      EMBEDDING_DEVICE: cpu
      EMBEDDING_NORMALIZE: "true"
      RAG_CHUNK_TOKENS: 450
      RAG_CHUNK_OVERLAP: 75
      RAG_TOP_K_CANDIDATES: 10
      RAG_TOP_K: 5
      RRF_K: 60
      RAG_MIN_SIMILARITY: 0.72
      RAG_MIN_LEXICAL_CONFIDENCE: uncalibrated
      RAG_THRESHOLD_CALIBRATED: "false"
      KNOWLEDGE_REINDEX_TIMEOUT_SECONDS: 120
      APPROVAL_TTL_HOURS: 24
      ALL_BUSINESS_WRITES_REQUIRE_APPROVAL: "true"
      MOCK_COMMERCE_BASE_URL: http://mock-commerce:8080/internal/v1
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      DEFAULT_CURRENCY: VND
      ALLOWED_UPLOAD_TYPES: text/markdown
      MAX_UPLOAD_MB: 2
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      REQUEST_RATE_LIMIT_PER_MINUTE: 60
      EMAIL_BACKEND: draft_only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [supportpilot-private]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [supportpilot-private]
    ports:
      - "5173:5173"

networks:
  supportpilot-private:
    driver: bridge

volumes:
  supportpilot-postgres-data:
